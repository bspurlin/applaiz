<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Applaiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
      />
    <style>
      ul {
	  list-style-type: none;
	  padding: 0;
	  display: flex;
	  flex-direction: column;
	  gap: 10px; /* Adds spacing between the boxed items */
      }

      /* Create the rounded box around each list item */
      .rounded-box {
	  border: 2px solid #3498db;     /* Defines the box outline color and thickness */
	  border-radius: 8px;           /* Rounds the corners of the box */
	  padding: 12px 16px;           /* Pushes text away from the box edges */
	  background-color: #f8f9fa;    /* Gives the box a light background fill */
      }  
    </style>
  </head>
  <body >
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
